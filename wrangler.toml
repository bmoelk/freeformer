name = "freeformer"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "public"
binding = "ASSETS"

[[rules]]
type = "Text"
globs = ["**/*.mustache"]
fallthrough = true

# Public Non-Sensitive Configuration Defaults
# ZERO secrets, private email addresses, or custom domain routes should be stored here!
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "warn"
ALLOWED_ORIGINS = "*"

# Rate Limiting Configuration
RATE_LIMIT_ENABLED = "false"
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW = "60"

# Spam Detection Configuration
SPAM_DETECTION_ENABLED = "true"
SPAM_THRESHOLD = "60"
SPAM_CATEGORIES = "all"
SPAM_HONEYPOT_FIELDS = "_hp,website,company_url"
SPAM_DIGEST_ENABLED = "true"
SPAM_DIGEST_MODE = "comprehensive"
SYS1POP_MODEL = "spam-detector-v1"

# Default Storage Engine (options: kv, d1, none)
STORAGE_ENGINE = "kv"

# Default Email Provider (options: none, console, resend, sendgrid, mailgun, mailtrap)
EMAIL_PROVIDER = "none"

# Infrastructure Bindings (Placeholders only - bound via Cloudflare Dashboard or wrangler.overrides.toml)
# [[kv_namespaces]]
# binding = "KV"
# id = "YOUR_KV_NAMESPACE_ID"

# [[d1_databases]]
# binding = "DB"
# database_name = "freeformer-db"
# database_id = "YOUR_DATABASE_ID"

# Optional Edge AI Classification Service Binding (Sys1Pop)
# [[services]]
# binding = "SYS1POP"
# service = "sys1pop"

# Production Secrets (Set via: npx wrangler secret put SECRET_NAME)
# - TURNSTILE_SECRET_KEY (Required)
# - API_KEY (Required for GET /submissions)
# - EMAIL_API_KEY (Required if EMAIL_PROVIDER != "none" or "console")
# - EMAIL_FROM (Required if EMAIL_PROVIDER != "none" or "console")
# - EMAIL_TO (Required if EMAIL_PROVIDER != "none" or "console")
# - WEBHOOK_URL (Optional webhook trigger)
# - SYS1POP_API_TOKEN (Optional Bearer token for Sys1Pop authentication)


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[triggers]
crons = ["0 9 * * 1"]

